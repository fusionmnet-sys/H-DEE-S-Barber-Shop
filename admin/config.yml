backend:
  name: github
  repo: fusionnet-sys/H-DEE-S-Barber-Shop
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: "https://hdssbarbershop.netlify.app"
display_url: "https://hdssbarbershop.netlify.app"

collections:
  - name: "business_info"
    label: "Business Info"
    files:
      - label: "Site Info"
        name: "site"
        file: "data/site.json"
        format: "json"
        fields:
          - { label: "Shop Name", name: "shopName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "State", name: "state", widget: "string" }
          - { label: "Zip", name: "zip", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Directions URL", name: "directionsUrl", widget: "string", required: false }

      - label: "Hours"
        name: "hours"
        file: "data/hours.json"
        format: "json"
        fields:
          - label: "Hours"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Open", name: "open", widget: "string" }
              - { label: "Close", name: "close", widget: "string" }
              - { label: "Closed", name: "closed", widget: "boolean", required: false, default: false }

      - label: "Services"
        name: "services"
        file: "data/services.json"
        format: "json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
