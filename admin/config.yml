# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: fusionmnet-sys/H-DEE-S-Barber-Shop
  branch: main
  identity_url: https://auth.decapbridge.com/sites/8ae8ba52-f7b4-4780-8a22-ca2c6684b07c
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

media_folder: "assets/images"
public_folder: "/assets/images"

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://hdssbarbershop.netlify.app

collections:
  - name: "site_info"
    label: "Site Info"
    files:
      - name: "site"
        label: "Shop Info"
        file: "data/site.json"
        format: json
        fields:
          - { label: "Shop Name", name: "shop_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subtext", name: "hero_subtext", widget: "text" }
          - { label: "Button Text", name: "cta_text", widget: "string" }
          - { label: "Button Link", name: "cta_link", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Address Line 1", name: "address_line1", widget: "string" }
          - { label: "Address Line 2", name: "address_line2", widget: "string" }
          - { label: "Google Maps Link", name: "maps_link", widget: "string" }
          - { label: "Walk-in Note", name: "walk_in_note", widget: "string" }
          - { label: "Footer Credit Text", name: "footer_text", widget: "string" }

      - name: "hours"
        label: "Hours"
        file: "data/hours.json"
        format: json
        fields:
          - label: "Hours"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Open", name: "open", widget: "string" }
              - { label: "Close", name: "close", widget: "string" }

      - name: "services"
        label: "Services & Prices"
        file: "data/services.json"
        format: json
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
